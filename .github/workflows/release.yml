name: release

# Builds the .deb, AppImage and jar and attaches them to a GitHub release. Two ways to start it:
#   - push a tag like v0.1.0, or
#   - Actions tab -> release -> "Run workflow" and enter a version; the tag is created for you.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the "v" (e.g. 0.1.0). Empty = build only, no release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    # Oldest supported Ubuntu, so the binaries also run on 24.04.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential file

      - name: Fetch appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Pick version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RELEASE=yes" >> "$GITHUB_ENV"
          elif [[ "$INPUT_VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
            echo "RELEASE=yes" >> "$GITHUB_ENV"
          elif [[ -z "$INPUT_VERSION" ]]; then
            echo "VERSION=0.0.0+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          else
            echo "Bad version: $INPUT_VERSION" >&2; exit 1
          fi
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Build packages
        run: make VERSION="$VERSION" APPIMAGETOOL="$RUNNER_TEMP/appimagetool" dist

      - uses: actions/upload-artifact@v4
        with:
          name: mojoloader-packages
          path: dist/*

      - name: Publish release
        if: env.RELEASE == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "mojoloader $VERSION" --generate-notes
