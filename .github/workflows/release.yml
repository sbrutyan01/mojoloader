name: release

# Pushing a tag like v0.1.0 builds the .deb, AppImage and jar and attaches them to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Oldest supported Ubuntu, so the binaries also run on 24.04.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential file

      - name: Fetch appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Pick version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV" ;;
            *)            echo "VERSION=0.0.0+${GITHUB_SHA::7}" >> "$GITHUB_ENV" ;;
          esac

      - name: Build packages
        run: make VERSION="$VERSION" APPIMAGETOOL="$RUNNER_TEMP/appimagetool" dist

      - uses: actions/upload-artifact@v4
        with:
          name: mojoloader-packages
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "mojoloader $VERSION" --generate-notes
